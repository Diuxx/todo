      <div class="skeleton-circle"></div>
      <div class="skeleton-circle"></div>

    <div class="detail-skeleton-content">

          <div class="skeleton-line"></div>
          <div class="detail-skeleton-actions">
            <div class="skeleton-circle skeleton-action"></div>
            <div class="skeleton-circle skeleton-action"></div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
