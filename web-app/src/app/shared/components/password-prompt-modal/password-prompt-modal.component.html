@if (visible) {
  <div class="password-prompt-overlay" (click)="closeModal()">
    <div class="password-prompt-dialog" (click)="$event.stopPropagation()">
      <div class="password-prompt-icon">
        <i class="bi bi-lock-fill"></i>
      </div>

      <h3 class="password-prompt-title">{{ title }}</h3>
      <p class="password-prompt-message">{{ message }}</p>

      <label class="password-prompt-label" for="itemUnlockPassword">Mot de passe</label>
      <input
        id="itemUnlockPassword"
        type="password"
        class="password-prompt-input"
        [(ngModel)]="password"
        placeholder="Entrer le mot de passe"
        (keydown.enter)="submit()"
      />

      @if (errorMessage) {
        <p class="password-prompt-error">{{ errorMessage }}</p>
      }

      <div class="password-prompt-actions">
        <button
          type="button"
          class="password-prompt-btn cancel"
          [disabled]="isSubmitting"
          (click)="closeModal()"
        >
          Annuler
        </button>
        <button
          type="button"
          class="password-prompt-btn confirm"
          [disabled]="isSubmitting || !password.trim()"
          (click)="submit()"
        >
          {{ isSubmitting ? 'Vérification...' : confirmText }}
        </button>
      </div>
    </div>
  </div>
}
