@if (visible) {
  <footer>
    <!-- <div class="footer-menu" [ngClass]="{ 'edit-mode': showSaveIcon }">
            <a [routerLink]="['/']" [queryParams]="{ filter: 'note' }" class="footer-menu-item">
                <img width="32px" src="/svgs/note.svg" alt="Note" class="footer-logo">
                <span>Notes</span>
            </a>
        </div> -->
    <div class="footer-menu" [ngClass]="{ 'edit-mode': showSaveIcon }">
      <button
        type="button"
        class="footer-menu-item"
        (click)="openSelectTypeModal()"
        aria-label="Créer un nouvel item"
      >
        <img width="32px" src="/svgs/new-2.svg" alt="Créer" class="footer-logo" />
        <span>New</span>
      </button>
    </div>
    <div class="footer-menu" [ngClass]="{ 'edit-mode': showSaveIcon }">
      <button
        type="button"
        class="footer-menu-item"
        (click)="goToCalendar()"
        aria-label="Ouvrir le calendrier"
      >
        <i class="bi bi-calendar3 footer-icon"></i>
        <span>Calendrier</span>
      </button>
    </div>
    <div
      class="footer-board"
      [ngClass]="{ 'save-icon-showed': showSaveIcon && !todoProgress }"
      (click)="onBoardClick()"
    >
      @if (todoProgress) {
        <canvas
          #todoProgressChart
          class="board-chart"
          width="90"
          height="90"
          aria-label="Progression todo"
        ></canvas>
        <span class="todo-progress-label">{{ todoProgress.done }}/{{ todoProgress.total }}</span>
      } @else {
        <canvas
          #progressChart
          class="board-chart"
          width="90"
          height="90"
          aria-label="Progression jour semaine mois"
        ></canvas>
      }
    </div>
    <div class="footer-menu" [ngClass]="{ 'edit-mode': showSaveIcon }">
      <button
        type="button"
        class="footer-menu-item"
        (click)="goToSettings()"
        aria-label="Ouvrir les paramètres"
      >
        <img width="32px" src="/svgs/cog-1.svg" alt="parametre" class="footer-logo" />
        <span>Paramètres</span>
      </button>
    </div>
  </footer>

  <select-item-type-modal
    [visible]="isSelectTypeModalVisible"
    (selectType)="onSelectItemType($event)"
    (close)="closeSelectTypeModal()"
  >
  </select-item-type-modal>
}
