@if (visible) {
  <footer>
    <div class="footer-menu" [ngClass]="{ 'edit-mode': showSaveIcon }">
      <button
        type="button"
        class="footer-menu-item"
        (click)="onPrimaryAction()"
        [attr.aria-label]="isDashboardRoute ? 'Créer un nouvel item' : 'Retour à l\'accueil'"
      >
        @if (isDashboardRoute) {
          <img width="32px" src="/svgs/new-2.svg" alt="Créer" class="footer-logo" />
          <span>New</span>
        } @else {
          <img width="32px" src="/svgs/home.svg" alt="Accueil" class="footer-logo" />
          <span>Home</span>
        }
      </button>
    </div>
    <div class="footer-menu" [ngClass]="{ 'edit-mode': showSaveIcon }">
      <button
        type="button"
        class="footer-menu-item"
        [ngClass]="{ 'has-badge': overdueCalendarCount > 0 }"
        (click)="goToCalendar()"
        aria-label="Ouvrir le calendrier"
      >
        <span class="footer-icon-wrapper">
          <img width="32px" src="/svgs/calendar.svg" alt="Calendrier" class="footer-logo" />
          @if (overdueCalendarCount > 0) {
            <span class="footer-badge">{{ overdueCalendarCount > 99 ? '99+' : overdueCalendarCount }}</span>
          }
        </span>
        <span>Calendrier</span>
      </button>
    </div>
    <div
      class="footer-board"
      [ngClass]="{ 'todo-progress-mode': !!todoProgress || isBudgetRoute }"
      (click)="onBoardClick()"
    >
      @if (isBudgetRoute) {
        <canvas
          #budgetProgressChart
          class="board-chart"
          width="90"
          height="90"
          aria-label="Synthèse budget de la période"
        ></canvas>
      } @else if (todoProgress) {
        <canvas
          #todoProgressChart
          class="board-chart"
          width="90"
          height="90"
          aria-label="Progression du todo par récurrence"
        ></canvas>
      } @else {
        <canvas
          #progressChart
          class="board-chart"
          width="90"
          height="90"
          aria-label="Progression jour semaine mois"
        ></canvas>
      }
    </div>
    <div class="footer-menu" [ngClass]="{ 'edit-mode': showSaveIcon }">
      <button
        type="button"
        class="footer-menu-item"
        (click)="goToBudget()"
        aria-label="Ouvrir le budget">
        <img width="32px" src="/svgs/money-bag.svg" alt="budget" class="footer-logo" />
        <span>Budget</span>
      </button>
    </div>
    <div class="footer-menu" [ngClass]="{ 'edit-mode': showSaveIcon }">
      <button
        type="button"
        class="footer-menu-item"
        (click)="goToSettings()"
        aria-label="Ouvrir les paramètres"
      >
        <img width="32px" src="/svgs/cog-1.svg" alt="parametre" class="footer-logo" />
        <span>Paramètres</span>
      </button>
    </div>
  </footer>

  <select-item-type-modal
    [visible]="isSelectTypeModalVisible"
    (selectType)="onSelectItemType($event)"
    (close)="closeSelectTypeModal()"
  >
  </select-item-type-modal>
}
