<div class="detail-container">
  @if (item) {
    <article class="detail-card" [class]="'type-' + item.type">
      <span class="detail-card-title">
        <input
          #titleInput
          type="text"
          class="editable title-editable"
          [(ngModel)]="item.title"
          placeholder="Titre de l'item" />
      </span>
      @if (item.type === 'todo' && item.todoContent?.length) {
        <div class="todo-list">
          @for (subItem of item.todoContent; track subItem.id) {
            <div class="todo-row">
              <input
                type="checkbox"
                class="todo-checkbox"
                [ngModel]="subItem.config?.status === 'done'"
                (ngModelChange)="subItem.config ? (subItem.config.status = $event ? 'done' : 'pending') : (subItem.config = { status: $event ? 'done' : 'pending', recurrenceType: 'none', alertEnabled: false })" />
              <span class="todo-subitem-title" [class.is-done]="subItem.config?.status === 'done'">{{ subItem.title }}</span>
              <div class="todo-actions">
                <button type="button" class="todo-action-btn" aria-label="Éditer la sous-tâche" (click)="openTodoEditModal(subItem)">
                  <i class="bi bi-pencil-fill" style="color: #576072;"></i>
                </button>
                <button type="button" class="todo-action-btn" aria-label="Supprimer la sous-tâche">
                  <i class="bi bi-trash-fill" style="color: #F95E5E;"></i>
                </button>
              </div>
            </div>
          }
        </div>
      }
      @else {
        <textarea
          #contentTextarea
          class="detail-card-content content editable"
          [(ngModel)]="item.content"
          placeholder="Écris ton contenu ici..."></textarea>
      }
      <div class="tags">
        @for (tag of item.tags; track tag) {
          <span>{{ tag }}</span>
        }
      </div>
    </article>
  }
  @else {
    <p>Item introuvable.</p>
  }
</div>

<todo-edit-modal
  [visible]="isTodoEditModalVisible"
  [subItem]="editingSubItem"
  (close)="closeTodoEditModal()"
  (save)="saveTodoModal()">
</todo-edit-modal>
