<div class="detail-container">
  @if (item) {
    <article class="detail-card" [class]="'type-' + item.type">
      <span class="detail-card-title">
        <input
          type="text"
          class="editable title-editable"
          [(ngModel)]="item.title"
          placeholder="Titre de l'item" />
      </span>
      @if (item.type === 'todo' && item.todoContent?.length) {
        <div class="todo-list">
          @for (subItem of item.todoContent; track subItem.id) {
            <div class="todo-row">
              <i class="bi" [class.bi-check2]="subItem.config?.status === 'done'" [class.bi-square]="subItem.config?.status !== 'done'"></i>
              <span [class.is-done]="subItem.config?.status === 'done'">{{ subItem.title }}</span>
            </div>
          }
        </div>
      }
      @else {
        <textarea
          #contentTextarea
          class="detail-card-content content editable"
          [(ngModel)]="item.content"
          placeholder="Écris ton contenu ici..."></textarea>
      }
      <div class="tags">
        @for (tag of item.tags; track tag) {
          <span>{{ tag }}</span>
        }
      </div>
    </article>
  }
  @else {
    <p>Item introuvable.</p>
  }
</div>
