@if (visible && subItemForm) {
  <div class="todo-modal-overlay" (click)="closeModal()">
    <div class="todo-modal" (click)="$event.stopPropagation()" [formGroup]="subItemForm">
      <div class="modal-header">
        <h3 class="modal-title">
          <i class="bi bi-pencil-square"></i>
          Éditer la tâche
        </h3>
        <button type="button" class="modal-close-btn" aria-label="Fermer" (click)="closeModal()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <p class="modal-subtitle">Mets à jour le texte, la récurrence et les alertes de cette sous-tâche.</p>

      <label class="modal-label">Texte</label>
      <textarea
        class="modal-textarea"
        formControlName="title"
        placeholder="Texte de la sous-tâche"></textarea>

      <label class="modal-label">Récurrence</label>
      <div class="recurrence-actions">
        @for (option of recurrenceOptions; track option) {
          <button
            type="button"
            class="recurrence-btn"
            [ngClass]="{ 'is-active': subItemForm.get('recurrenceType')?.value === option }"
            (click)="selectRecurrence(option)">
            {{ option }}
          </button>
        }
      </div>

      <div class="alert-section">
        <button
          type="button"
          class="alert-toggle-btn"
          [ngClass]="{ 'is-active': subItemForm.get('alertEnabled')?.value }"
          (click)="toggleAlert()">
          <i class="bi" [ngClass]="subItemForm.get('alertEnabled')?.value ? 'bi-bell-fill' : 'bi-bell'"></i>
          Alertes
        </button>
        @if (subItemForm.get('alertEnabled')?.value) {
          <div class="alert-time-wrap">
            <label class="modal-label">Heure</label>
            <input
              type="time"
              class="alert-time-input"
              formControlName="alertAt" />
          </div>
        }
      </div>

      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn-alert" (click)="closeModal()">Annuler</button>
        <button type="button" class="modal-btn modal-btn-primary" (click)="saveModal()">
          <i class="bi bi-check2"></i>
          Valider
        </button>
      </div>
    </div>
  </div>
}
