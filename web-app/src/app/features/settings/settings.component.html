@if (settingsForm) {
<div class="settings-container" [formGroup]="settingsForm">

  <div class="settings-card">
    <div class="settings-card-header">
      <h1 class="settings-card-title">Options</h1>
      <span class="save-badge" [ngClass]="{ visible: savedFeedback }">
        <i class="bi bi-check2"></i> Enregistré
      </span>
    </div>

    <!-- Profil -->
    <section class="settings-section">
      <h2 class="settings-section-title">
        <i class="bi bi-person-fill"></i> Profil
      </h2>

      <div class="form-field">
        <label class="form-label" for="userName">Nom d'utilisateur</label>
        <input
          id="userName"
          type="text"
          class="form-input"
          formControlName="userName"
          placeholder="Votre nom" />
      </div>

      <div class="form-field">
        <label class="form-label" for="userId">ID utilisateur</label>
        <input
          id="userId"
          type="text"
          class="form-input readonly"
          formControlName="userId"
          readonly />
        <span class="form-hint">Utilisé pour la sauvegarde et restauration des données.</span>
      </div>
    </section>

    <!-- Apparence -->
    <!--

    <!-- Préférences -->
    <section class="settings-section">
      <h2 class="settings-section-title">
        <i class="bi bi-sliders"></i> Préférences
      </h2>

      <div class="toggle-field">
        <div class="toggle-field-info">
          <span class="toggle-label">Affirmation du jour</span>
          <span class="toggle-hint">Affiche une affirmation positive au démarrage.</span>
        </div>
        <label class="toggle">
          <input type="checkbox" formControlName="dailyAffirmationEnabled" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="toggle-field">
        <div class="toggle-field-info">
          <span class="toggle-label">Éléments archivés</span>
          <span class="toggle-hint">Affiche les éléments archivés dans le tableau de bord.</span>
        </div>
        <label class="toggle">
          <input type="checkbox" formControlName="showArchivedItems" />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </section>

  </div>
</div>
