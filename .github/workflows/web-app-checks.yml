name: Web app checks

on:
  pull_request:
    paths:
      - 'web-app/**'
      - '.github/workflows/web-app-checks.yml'
  push:
    branches:
      - develop
    paths:
      - 'web-app/**'
      - '.github/workflows/web-app-checks.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No lockfile is currently tracked; use npm install until one is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Angular app
        run: npm run build
      - name: Run unit tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless
